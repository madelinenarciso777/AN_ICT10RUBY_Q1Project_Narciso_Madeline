<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skewer - SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #ff4500 0%, #d32f2f 100%);
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: #b32d00;
            border-bottom: 1px solid #802000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: #ffffff !important;
        }

        .nav-link {
            color: #ffccbc !important;
            font-size: 0.95rem;
            font-weight: 500;
            margin-left: 1rem;
        }

        .nav-link.active {
            color: #ffffff !important;
            font-weight: bold;
        }

        .app-card {
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            color: #212529;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .card-header-gradient {
            background: linear-gradient(135deg, #1e3c72 0%, #0a1931 100%);
            color: #ffffff;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        /* Form Inputs */
        .form-label {
            font-weight: 600;
            color: #333333;
            font-size: 0.95rem;
        }

        .form-control, .form-select {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #1e3c72;
            box-shadow: 0 0 0 0.2rem rgba(30, 60, 114, 0.25);
        }

        /* Blue Action Button */
        .btn-gradient {
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 1.5rem;
            color: #ffe0b2;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark navbar-custom px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Skewer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="index.html">SKU Generator</a>
                <a class="nav-link" href="receipt.html">Receipt Generator</a>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-5 d-flex justify-content-center align-items-center">
        <div class="app-card">

            <div class="card-header-gradient">
                <h3 class="fw-bold mb-0">SKU Generator</h3>
            </div>

        
            <div class="p-4 p-sm-5">
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select">
                        <option value="PER">Perishables</option>
                        <option value="BEV">Beverages</option>
                        <option value="BAK">Bakery & Pastries</option>
                        <option value="MER">Merchandise</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="prod_name" class="form-label">Product Name</label>
                    <input type="text" id="prod_name" class="form-control" placeholder="e.g. Bottled Water">
                </div>

                <div class="mb-4">
                    <label for="stock_qty" class="form-label">Stock Quantity</label>
                    <input type="number" id="stock_qty" class="form-control" placeholder="e.g. 50" min="0">
                </div>

                <button id="btn-generate" class="btn btn-gradient shadow-sm mb-4" py-click="generate_sku">Generate SKU</button>

                <div id="sku-result" class="text-center py-2 text-muted">
                    Your generated SKU will appear here.
                </div>
            </div>
        </div>
    </div>

    <footer>
        &lt;/&gt; SKU Generator — 1st Quarter Project
    </footer>

    <script type="py" src="./main_sku.py"></script>
</body>
</html>
