<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skewer - Receipt Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #ff4500 0%, #d32f2f 100%);
            color: #ffffff;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: #b32d00;
            border-bottom: 1px solid #802000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: #ffffff !important;
        }

        .nav-link {
            color: #ffccbc !important;
            font-size: 0.95rem;
            font-weight: 500;
            margin-left: 1rem;
        }

        .nav-link.active {
            color: #ffffff !important;
            font-weight: bold;
        }

        .app-card {
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            color: #212529;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .card-header-gradient {
            background: linear-gradient(135deg, #1e3c72 0%, #0a1931 100%);
            color: #ffffff;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 1.5rem;
            color: #ffe0b2;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark navbar-custom px-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Skewer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">SKU Generator</a>
                <a class="nav-link active" href="receipt.html">Receipt Generator</a>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-5 d-flex justify-content-center align-items-center">
        <div class="app-card">
            <div class="card-header-gradient">
                <h3 class="fw-bold mb-1">OBMC Entrep Fair</h3>
                <p class="mb-0 opacity-75 small">Group 1 — Coffee Shop</p>
            </div>

        
            <div class="p-4 p-sm-5">
                <h6 class="fw-bold mb-3">Menu Selection</h6>
                
                <div class="mb-3">
                    <select id="item_select" class="form-select">

<option value="Americano">Americano (₱99)</option>
<option value="Spanish Latte">Spanish Latte (₱129)</option>
<option value="Cold Brew Malt">Cold Brew Malt (₱189)</option>
<option value="Affogato">Affogato (₱159)</option>
<option value="Caramel Macchiato">Caramel Macchiato (₱129)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="item_qty" class="form-label text-muted small">Quantity</label>
                    <input type="number" id="item_qty" class="form-control" value="1" min="1">
                </div>

                <button id="btn-order" class="btn btn-gradient shadow-sm mb-4" py-click="create_order">
                    Create Order
                </button>

                <div id="receipt-result" class="text-center py-2 text-muted">
                    Your order summary will appear here.
                </div>
            </div>
        </div>
    </div>

    <footer>
        &lt;/&gt; SKU Generator — 1st Quarter Project
    </footer>

    <script type="py" src="./main_receipt.py"></script>
</body>
</html>
